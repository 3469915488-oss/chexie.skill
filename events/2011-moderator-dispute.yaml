stakeholder_positions:
  zhuangsheng:
    summary: "版务权力需要明确边界，理事会/执委会权力来源不明"
    logic: "版务有锁帖删帖封禁权力 → 这些权力是谁给的 → 理事会/执委会 → 他们的权力又是谁给的 → 禅让制非民选 → 合法性存疑"

connection_to_other_events: |
  此事件与2013甘道夫封禁控诉事件构成"论坛权力管控"系列。
  2011年庄生主动开帖讨论（正面），2013年甘道夫被封禁后控诉（反弹）。
  两次事件都触及同一核心问题：协会治理的权力合法性来源。
