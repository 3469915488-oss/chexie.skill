    description: "版主庄生锁帖，引发会员质疑"
  - name: "版主开帖讨论"
    date: "2011-11-06"
    description: "庄生主动开帖讨论版务权力边界"
  - name: "权力合法性追问"
    date: "2011-11-07 ~ 2011-11-08"
    description: "讨论从版务权力扩展到理事会/执委会权力来源"

