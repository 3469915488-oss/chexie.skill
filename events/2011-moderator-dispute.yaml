name: "2011版主争议事件"
date_range: "2011-11-06 ~ 2011-11-08"
severity: "中度争议"

summary: |
  2011年11月，行者足音版主庄生锁帖引发争议。庄生开帖讨论版主权力的边界，
  质疑理事会和执委会的权力合法性——他们的权力是"禅让制"而非民选，
  版务的封禁删帖权力来源不明。这是车协论坛上第一次公开讨论"权力合法性"问题。

phases:
  - name: "导火索"
