connection_to_other_events: |
  此事件与2011版主争议、2013甘道夫封禁控诉构成"论坛权力管控"三部曲。
  2011年讨论版务权力边界，2013年纪律争论中版主锁帖（执行），
  2013年甘道夫被封禁后控诉（反弹）。
