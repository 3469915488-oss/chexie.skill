name: "2013纪律争论事件"
date_range: "2013-11-25 ~ 2013-11-30"
severity: "中度争议"

summary: |
  2013年11月，某帖讨论下坡超车引发激烈争执，版主锁帖。
  李杏在行者足音开新帖《我也说纪律》，引发57回复/22人参与的大规模讨论。
  核心争论：纪律的重要性 vs 强调纪律的方式。
  马丁（强硬派）认为对待纪律问题不应温和——温和的表达不会有大的效果。
  反对者认为锁帖不能解决矛盾，反而有吸引效应。

phases:
  - name: "导火索"
