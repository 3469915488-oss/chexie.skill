connection_to_other_events: |
  此事件与2011版主争议构成"论坛权力管控"系列。
  2011年庄生主动开帖讨论版务权力边界（正面），
  2013年甘道夫被封禁后控诉（反弹）。
  甘道夫自称"爱闹事儿，但讲道理，不胡闹"——这种姿态与2025年dudu开炮、
  2026年劳模追责一脉相承：都是老会员在论坛上以个人身份挑战协会既有权力结构。
