name: "2013甘道夫封禁控诉事件"
date_range: "2013-11-27 ~ 2013-11-29"
severity: "高度争议"

summary: |
  老会员甘道夫（2010年入协）因在论坛上的发言被版务封禁删帖。
  解封后，甘道夫在行者足音发帖《既然解了封，那就让我先说完这段话再farewell》，
  用极强的语气控诉版务权力来源不合法、理事会执委会非民选。
  核心论述：版务的封禁权力是谁给的（理事会）→ 理事会的权力是谁给的（禅让制非民选）
  → 权力的合法性存在问题 → "和谐"是无原则的掩饰。
  这是车协论坛上对协会治理合法性的最尖锐公开挑战之一。

