    logic: "作弊事实或有争议 → 取消暑期资格过重 → 应有其他处罚方式"

connection_to_other_events: |
  此事件与2017主席团批评文体部长事件同属"执委会决策的程序正当性"系列。
  2016年是理事会对普通会员的处罚，2017年是主席团对执委会成员的批评。
  两次事件都触及"谁有权处罚、程序是否正当"的核心问题。
