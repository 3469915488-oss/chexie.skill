    description: "金万琳在春训考勤中作弊"
  - name: "理事会调查"
    date: "2016-05-02之前"
    description: "理事会调查作弊事实"
  - name: "处罚公告"
    date: "2016-05-02"
    description: "理事会发布处罚公告，取消暑期预备队员资格"
  - name: "论坛讨论"
    date: "2016-05-02 ~ 2016-05-04"
    description: "会员讨论处罚是否合理"

