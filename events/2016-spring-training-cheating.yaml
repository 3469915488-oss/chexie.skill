name: "2016金万琳作弊处罚事件"
date_range: "2016-05-02 ~ 2016-05-04"
severity: "中度争议"

summary: |
  2016年春训，金万琳因春训考勤作弊被理事会处罚——取消暑期预备队员资格。
  理事会在论坛发布处罚公告，引发讨论。核心争议：
  1. 作弊事实认定（是否故意）
  2. 处罚力度是否过重（取消暑期资格）
  3. 程序正当性（理事会有无权力做出此处罚）
  这是车协历史上少有的因训练作弊被公开处罚的案例。

phases:
  - name: "作弊发生"
