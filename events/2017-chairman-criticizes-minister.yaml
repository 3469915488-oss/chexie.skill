name: "2017主席团批评文体部长事件"
date_range: "2017-06-01 ~ 2017-06-02"
severity: "中度争议"

summary: |
  2017年穿越拉练，文体部长在拉练组织中出现问题。拉练结束后，
  主席团在论坛公开发帖严厉批评文体部长，引发27回复/11人参与讨论。
  核心争议：
  1. 主席团是否有权公开批评执委会成员
  2. 文体部长的问题是否严重到需要公开批评
  3. 批评的时机和方式是否恰当
  这是车协历史上罕见的"上级公开批评下级"案例，打破了通常的内部沟通惯例。

phases:
