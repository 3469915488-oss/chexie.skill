    url: "https://www.chexie.net/bbs/content/index.php?bid=1&tid=8052&p=1"

keywords:
  primary: [师徒制, 取消, 修车讲座, 日常化, 实践部, 改革]
  secondary: [效率, 文化传承, 师门, 押后培养, 技术传承]

key_figures:
  - id: 实践部
    role: "改革推动方"
    position: "认为师徒制效率低，日常化讲座更灵活"
  - id: 反对者
    role: "传统维护方"
    position: "认为师徒制是文化传承，不应取消"

stakeholder_positions:
  practice_dept:
    summary: "师徒制效率低，日常化讲座更灵活高效"
    logic: "师徒制依赖个人 → 时间不灵活 → 日常化讲座统一时间 → 更多人参与 → 效率提升"
  traditionalists:
    summary: "师徒制是文化传承，不应为效率牺牲"
    logic: "师徒制传承技术+人格 → 日常化只是技术 → 失去文化传承 → 效率不等于质量"

connection_to_other_events: |
  此事件与2024反对bbzb事件同属"协会文化变革"系列。
  2018年是制度层面的变革（师徒制），2024年是文化层面的变革（bbzb）。
  两次变革都触及了协会传统文化的核心，引发了"效率vs传承"的争论。
