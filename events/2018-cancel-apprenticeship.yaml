name: "2018取消师徒制事件"
date_range: "2018-04-21 ~ 2018-04-23"
severity: "中度争议"

summary: |
  2018年4月，实践部宣布取消传统的师徒制，改为日常化修车讲座模式。
  这一改革引发35回复/23人参与的激烈讨论。核心争议：
  1. 取消师徒制是否合理（效率提升 vs 文化传承）
  2. 改革时机是否恰当（学期中段突然宣布）
  3. 新模式的实际效果（是否真能提高效率）
  这是车协历史上重要的制度变革，触及了传统师门文化的核心。

phases:
  - name: "改革宣布"
    date: "2018-04-21"
    description: "实践部宣布取消师徒制，改为日常化修车讲座"
  - name: "激烈讨论"
    date: "2018-04-21 ~ 2018-04-23"
    description: "会员激烈讨论改革是否合理"
  - name: "后续实施"
    date: "2018年之后"
    description: "新模式实施，后续似乎恢复师徒制"

core_posts:
  - tid: 8052
    bid: 1
