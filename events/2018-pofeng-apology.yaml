name: "2018破风致歉事件"
date_range: "2018-08-24 ~ 2018-08-29"
severity: "中度争议"

summary: |
  2018年暑期远征，团长破风与飞行团团长夏夏（情侣关系）在路线规划中多次见面。
  此事被曝光后引发争议，破风在论坛发帖致歉，引发17回复/12人参与讨论。
  核心争议：
  1. 情侣团长是否应该避嫌（利益冲突）
  2. 路线规划中多次见面是否恰当（工作vs私人关系）
  3. 理事会是否应该干预（规则vs人性）
  这是车协历史上少有的因私人关系影响工作决策的争议案例。

