stakeholder_positions:
  should_go_all:
    summary: "应去尽去，不应因制度原因让队员落选"
    logic: "通过春训 = 有资格 → 制度问题不应由个人承担 → 应开三个团或找其他方案"
  elite_selection:
    summary: "精英化选拔，确保队伍质量"
    logic: "暑期远征是高成本活动 → 需要高质量队伍 → 精英化选拔是必要的"
  communication_failure:
    summary: "沟通失职是核心问题"
    logic: "决定本身或有道理 → 但沟通太晚 → 预备队员无准备时间 → 沟通失职是核心问题"

connection_to_other_events: |
  此事件是车协历史上最大规模的争议，持续一年，涉及多个阶段。
  与2018破风致歉事件同属"规则vs人性"系列。
  2018年是私人关系影响工作决策，2025年是制度规则影响个人利益。
  与2026年系列事件（劳模制度批评、冬游特批、押后拆夹器）构成"25-26年制度崩坏"系列。
  2025年分团是制度崩坏的起点，2026年系列事件是延续。
