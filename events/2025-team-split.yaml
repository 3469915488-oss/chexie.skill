name: "2025暑期分团事件"
date_range: "2025-05-23 ~ 2026-05-27"
severity: "高度争议"

summary: |
  2025年暑期远征，理事会决定只开两个团（而非传统的三个团），
  导致约11名通过春训的预备队员落选。此事引发车协历史上最大规模的论坛争议，
  持续一年，涉及多个阶段：
  1. 2025年5月：分团决定引发争议
  2. 2025年5月：dudu开炮，引发大规模讨论
  3. 2025年5月：柏拉图发起"第三团"倡议
  4. 2026年5月：劳模发帖追责25理事会
  5. 2026年5月：蓝、牛肉汤圆发帖回应
  核心争议：应去尽去 vs 精英化、沟通失职、制度崩坏

