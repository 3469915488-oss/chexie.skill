name: "2026模式口冲突事件"
date_range: "2026-05-30 ~ 2026-05-31"
severity: "中度争议"

summary: |
  2026年模式口拉练，队长在拉练组织中与会员发生冲突。
  拉练结束后，会员在论坛发帖批评队长，引发17回复/12人参与讨论。
  核心争议：
  1. 队长的管理方式是否恰当（强硬vs温和）
  2. 会员的行为是否违规（不服从指挥）
  3. 冲突的责任归属（队长vs会员）
  这是25-26年制度崩坏系列中的一个具体案例，反映了基层管理的困难。

