stakeholder_positions:
  opponent:
    summary: "特批破坏公平性，程序不正当"
    logic: "选拔有明确标准 → 特批绕过标准 → 对未通过者不公平 → 理事会无权单独决定"
  council:
    summary: "特殊情况需要灵活处理，理事会有权决定"
    logic: "特殊情况存在 → 严格标准可能不合理 → 理事会有权灵活处理 → 特批是必要的"

connection_to_other_events: |
  此事件与2025暑期分团事件同属"选拔公平性"系列。
  2025年是落选队员质疑分团决定，2026年是未特批队员质疑特批决定。
  两次事件都触及了"选拔标准和公平性"的核心问题。
  与2026劳模制度批评、2026押后拆夹器、2026冬游C组押后构成"25-26年制度崩坏"系列。
