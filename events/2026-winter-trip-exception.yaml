name: "2026冬游特批事件"
date_range: "2026-01-26 ~ 2026-01-28"
severity: "中度争议"

summary: |
  2026年冬游，某队员因特殊情况申请特批参加，理事会批准后引发争议。
  反对者在论坛发帖质疑特批的合理性和程序正当性，引发6回复/6人参与讨论。
  核心争议：
  1. 特批的标准是否明确（什么情况可以特批）
  2. 特批的程序是否正当（理事会是否有权单独决定）
  3. 特批是否破坏公平性（对未通过选拔的队员不公平）
  这是车协历史上首次因特批引发的公开争议。

phases:
  - name: "特批申请"
    date: "2026年冬游前"
    description: "某队员因特殊情况申请特批"
  - name: "理事会批准"
    date: "2026年冬游前"
    description: "理事会批准特批申请"
  - name: "质疑发帖"
    date: "2026-01-26"
    description: "反对者在论坛发帖质疑"
  - name: "讨论"
    date: "2026-01-26 ~ 2026-01-28"
    description: "会员讨论特批的合理性"

