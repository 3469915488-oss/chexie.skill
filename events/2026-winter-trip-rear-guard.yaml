name: "2026冬游C组押后事件"
date_range: "2026-01 ~ 2026-02-12"
severity: "中度争议"

summary: |
  2026年冬游C组，实践部在押后任命上出现问题。
  实践部长独自决定任命，未与部员沟通，未参考师父意见，未向主席团说明。
  冬游结束后，实践部在论坛发布说明承认工作失误，引发24回复/17人参与讨论。
  核心争议：
  1. 押后任命的程序是否正当（部长独断 vs 集体决策）
  2. 任命的标准是否合理（是否考虑了能力匹配）
  3. 实践部的工作方式是否需要改进
  这是车协历史上首次因押后任命引发的公开争议。

