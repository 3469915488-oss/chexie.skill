# 简洁模式 prompt
# 当用户只想要快速结论时用

name: "简洁总结"
trigger: ["简述", "总结一下", "一句话", "简洁"]

instructions: |
  根据以下关于「{query}」的论坛资料，做简洁回答。

  ## 执行步骤

  ### 第一步：从检索结果中提取核心事实

  只保留最高确定度的事实，每条必须绑定 source_id：

  ```
  facts:
    - source_id: bid{N}_tid{N}_floor{N}
      quote: 原文关键句
  ```

  ### 第二步：输出

  格式：
  1. 一句话结论（来自最高权重来源）[source_id]
  2. 关键背景（如有）[source_id]
  3. 不同意见（如有）[source_id]
  4. 参考来源链接

  ### 第三步：自检

  - 每句话有 source_id 吗？没有则删除
  - 有没有不确定的细节？有则标"证据不足"

  不展开细节，不做多段分析。3-5 句话以内。
